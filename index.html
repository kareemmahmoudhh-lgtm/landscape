  });
  var tt=tot(),od='<path d="M'+(X0-94)+' '+topY+'v'+(lastY-topY)+'M'+(X0-100)+' '+topY+'h12M'+(X0-100)+' '+lastY+'h12" stroke="var(--ink)" stroke-width=".8" fill="none"/><text transform="rotate(-90 '+(X0-98)+' '+((topY+lastY)/2)+')" x="'+(X0-98)+'" y="'+((topY+lastY)/2)+'" text-anchor="middle" style="font-weight:600">'+tt+' mm</text>';
  var ffl='<path d="M10 '+topY+'H'+(X0+W+20)+'" stroke="var(--ink)" stroke-width=".7" stroke-dasharray="8 3 2 3" fill="none"/><text x="12" y="'+(topY-5)+'" style="font-weight:600">FFL ±0.00</text>';
  return '<svg viewBox="0 0 700 '+(Math.max(y,ly)+60)+'" role="img" aria-label="Section of '+cur.n+'">'+defs+ffl+o+tags+od+'</svg>';
}
function propsHtml(){
  var kv=[['Family','Floor: Landscape Assembly'],['Type',cur.n],['Category',cat==='h'?'Hardscape':'Softscape'],['Group',cur.g],['Unit / size',cur.sz],['Typical use',cur.u],['Layers',L.length],['Total thickness','<b id="tt">'+tot()+' mm</b>']];
  var rows=L.map(function(l,i){
    return '<tr><td>'+(i+1)+'</td><td>'+fn(l,i)+'</td><td><span class="sw" style="background:'+F[l[0]]+'"></span>'+l[1]+(l[3]?'<span class="sm">'+l[3]+'</span>':'')+'</td><td>'+(l[0]==='sub'&&!l[2]?'—':'<input type="number" min="0" step="5" value="'+l[2]+'" data-i="'+i+'" aria-label="Thickness of '+l[1]+'">')+'</td></tr>'}).join('');
  return '<table class="kv">'+kv.map(function(r){return '<tr><td>'+r[0]+'</td><td>'+r[1]+'</td></tr>'}).join('')+'</table>'+
  '<h3 style="margin-top:10px">Edit Assembly (top = exterior)</h3><table><thead><tr><th>#</th><th>Function</th><th>Material</th><th>Thick. (mm)</th></tr></thead><tbody>'+rows+'</tbody></table>'+
  (cur.cu&&own?'<div class="note"><button class="btn" id="del">Delete this type</button></div>':'')+'<div class="note">Typical values for guidance only. Follow project specifications and the structural engineer’s and supplier’s requirements. Edits here are temporary and not saved.</div>';
}
function render(){
  if(!cur){$('view').innerHTML='<div class="empty">Select a floor type from the Project Browser to view its section.</div>';$('props').innerHTML='<div class="empty">No type selected.</div>';return}
  $('view').innerHTML='<div class="wrap" id="dr">'+drawing()+'</div><div class="vt"><b>Section – '+cur.n+'</b><div>Scale: NTS · Dimensions in mm · Thin layers exaggerated</div></div>';
  $('props').innerHTML=propsHtml();
}
function pick(id){cur=ALL().filter(function(d){return String(d.id)===String(id)})[0];if(!cur)return;L=cur.L.map(function(l){return l.slice()});tree();render()}
function txt(){return unesc(cur.n+' ('+cur.sz+')\n'+L.map(function(l,i){return (i+1)+'. '+l[1]+(l[2]?' – '+l[2]+' mm':'')}).join('\n')+'\nTotal: '+tot()+' mm (excluding subgrade)')}
function formHtml(){
  var gl={};ALL().forEach(function(d){gl[d.g]=1});
  var mo=Object.keys(DN).map(function(k){return '<option value="'+k+'">'+DN[k]+'</option>'}).join('');
  var rows=fr.map(function(r,i){return '<div class="fr"><select data-r="'+i+'" data-k="0" aria-label="Material">'+mo.replace('value="'+r[0]+'"','value="'+r[0]+'" selected')+'</select><input class="nm" data-r="'+i+'" data-k="1" value="'+esc(r[1])+'" placeholder="'+esc(DN[r[0]])+'" aria-label="Layer name"><input class="mm" type="number" min="0" step="5" data-r="'+i+'" data-k="2" value="'+esc(r[2])+'" aria-label="Thickness mm"><input class="nt" data-r="'+i+'" data-k="3" value="'+esc(r[3])+'" placeholder="Note" aria-label="Note"><button class="btn" data-rm="'+i+'" aria-label="Remove layer">×</button></div>'}).join('');
  return '<div class="form"><h3>Add Floor Type</h3>'+
  '<div class="fg"><label>Category</label><select data-f="c"><option value="h"'+(ff.c==='h'?' selected':'')+'>Hardscape</option><option value="s"'+(ff.c==='s'?' selected':'')+'>Softscape</option></select>'+
  '<label>Group</label><input data-f="g" list="gl" value="'+esc(ff.g)+'" placeholder="e.g. Pavers"><datalist id="gl">'+Object.keys(gl).map(function(g){return '<option value="'+g+'">'}).join('')+'</datalist>'+
  '<label>Type name</label><input data-f="n" value="'+esc(ff.n)+'"><label>Unit / size</label><input data-f="sz" value="'+esc(ff.sz)+'" placeholder="600×300 mm, 30 thick"><label>Typical use</label><input data-f="u" value="'+esc(ff.u)+'"></div>'+
  '<b>Layers (top = exterior)</b>'+rows+'<div class="fr"><button class="btn" id="al">+ Add layer</button></div><div id="fm"></div><div class="fr"><button class="btn pri" id="sv">Save type</button><button class="btn" id="cn">Cancel</button></div></div>';
}
function openForm(){
  ff={c:cat,g:'',n:'',sz:'',u:''};
  fr=[['paver','',60,''],['sand','',30,''],['agg','',150,''],['sub','',0,'']];
  $('view').innerHTML=formHtml();$('props').innerHTML='<div class="note">Pick a material for each layer. The material sets the hatch in the section. Leave the name empty to use the default material name. Use 0 mm for membranes and subgrade.</div>';
}
function msg(t){var m=$('fm');if(m)m.textContent=t}
async function save(){
  var rows=fr.map(function(r){return [r[0],String(r[1]||DN[r[0]]).trim(),Math.max(0,+r[2]||0),String(r[3]||'').trim()]});
  if(!ff.n.trim()||!ff.g.trim()){msg('Enter a group and a type name.');return}
  if(!rows.length){msg('Add at least one layer.');return}
  try{var ref=await db.collection('types').add({c:ff.c,g:ff.g.trim(),n:ff.n.trim(),sz:ff.sz.trim(),u:ff.u.trim(),L:JSON.stringify(rows)});pend='c-'+ref.id;msg('Saved.')}
  catch(e){msg('Could not save: '+((e&&(e.message||e.code))||'error'))}
}
document.addEventListener('click',function(e){
  var t=e.target;
  if(t.id==='add'){openForm();return}
  if(t.id==='al'){fr.push(['agg','',0,'']);$('view').innerHTML=formHtml();return}
  if(t.dataset&&t.dataset.rm!==undefined){fr.splice(+t.dataset.rm,1);$('view').innerHTML=formHtml();return}
  if(t.id==='cn'){render();return}
  if(t.id==='sv'){save();return}
  if(t.id==='del'&&cur&&cur.cu){
    if(!t.dataset.sure){t.dataset.sure=1;t.textContent='Click again to delete';return}
    db.collection('types').doc(cur.did).delete().catch(function(){t.textContent='Delete failed'});return}
  if(t.classList.contains('tab')){cat=t.dataset.c;document.querySelectorAll('.tab').forEach(function(b){b.setAttribute('aria-pressed',b===t)});cur=null;tree();render();return}
  var it=t.closest('.it');if(it){pick(it.dataset.id);$('view').scrollIntoView({block:'start'});return}
  if(!cur)return;
  if(t.id==='rs')pick(cur.id);
  if(t.id==='pr')window.print();
  if(t.id==='cp'){try{navigator.clipboard.writeText(txt()).then(function(){t.textContent='Copied'},function(){t.textContent='Copy unavailable'})}catch(x){t.textContent='Copy unavailable'}}
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='q'){tree();return}
  if(t.dataset&&t.dataset.f){ff[t.dataset.f]=t.value;return}
  if(t.dataset&&t.dataset.r!==undefined){fr[+t.dataset.r][+t.dataset.k]=t.value;return}
  if(t.dataset&&t.dataset.i!==undefined){L[+t.dataset.i][2]=Math.max(0,+t.value||0);$('dr').innerHTML=drawing();$('tt').textContent=tot()+' mm'}
});
tree();render();
(async function(){
  if(typeof claude==='undefined'||!claude.use)return;
  try{var u=await claude.use('user');own=u?await u.isOwner():false}catch(e){}
  try{db=await claude.use('db')}catch(e){}
  if(!db)return;
  $('lib').hidden=!own;
  db.collection('types').onSnapshot(function(sn){
    CUS=[];
    sn.docs.forEach(function(d){
      try{var x=d.data()||{},ls=JSON.parse(x.L||'[]').filter(function(l){return F[l[0]]}).map(function(l){return [l[0],esc(l[1]),Math.max(0,+l[2]||0),esc(l[3])]});
        if(ls.length&&(x.c==='h'||x.c==='s')&&x.n)CUS.push({id:'c-'+d.id,did:d.id,c:x.c,g:esc(x.g||'Other'),n:esc(x.n),sz:esc(x.sz),u:esc(x.u),L:ls,cu:1})}catch(e){}
    });
    if(pend&&CUS.some(function(d){return d.id===pend})){var pp=pend;pend=null;cat=CUS.filter(function(d){return d.id===pp})[0].c;document.querySelectorAll('.tab').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.c===cat)});pick(pp);return}
    if(cur&&cur.cu&&!CUS.some(function(d){return d.id===cur.id})){cur=null;L=null;render()}
    tree();
  },function(){});
})();
</script>
</body>
</html>
