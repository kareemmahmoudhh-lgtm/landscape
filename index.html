<html lang="en">
<head>
<meta charset="utf-8">

<title>Landscape Assemblies – Floor Type Library</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
<style>
:root{--bg:#f4f8f1;--card:#fff;--ink:#1f3a2b;--tx:#2f4a3a;--mu:#587063;--ln:#dfe9dc;--ln2:#c9d9c6;--soft:#e8f1e4;--pri:#2f7d4f;--on:#fff;--acc:#b45309;--ring:#2f7d4f;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:400 16px/1.55 Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
a{color:inherit;text-decoration:none}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--ring);outline-offset:3px}
button{font:inherit;cursor:pointer}
.top{border-bottom:1px solid var(--ln);background:#fff}
.bar{display:flex;align-items:center;justify-content:space-between;height:64px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:-.01em}
.brand i{width:26px;height:26px;display:grid;grid-template-rows:7px 5px 3px 11px;gap:0;border:1.5px solid var(--ink)}
.brand i b{display:block}.brand i b:nth-child(1){background:var(--pri)}.brand i b:nth-child(2){background:#a8a29e}.brand i b:nth-child(3){background:var(--acc)}.brand i b:nth-child(4){background:#78350f}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--ln2);background:var(--card);color:var(--ink);padding:9px 16px;border-radius:4px;font-weight:500;font-size:14px;transition:background .2s,border-color .2s,transform .2s}
.btn:hover{border-color:var(--pri);color:var(--pri)}
.btn.pri:hover{color:#fff}
.btn.pri{background:var(--pri);color:var(--on);border-color:var(--pri)}
.btn.pri:hover{filter:brightness(1.08)}
.btn svg,.back svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--acc);margin:0 0 14px}
h1{font-size:clamp(34px,6.4vw,68px);line-height:1.02;letter-spacing:-.035em;font-weight:700;margin:0;color:var(--ink)}
.lead{color:var(--mu);font-size:17px;max-width:520px;margin:18px 0 0}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;padding:48px 44px;margin:24px 0 36px;background:linear-gradient(135deg,#e6f1df,#f3efe0);border-radius:10px}
.stats{display:flex;gap:36px;margin-top:32px;padding-top:20px;border-top:1px solid #b9cdb4}
.stats b{display:block;font-size:30px;font-weight:700;color:var(--ink);letter-spacing:-.02em;line-height:1.1}
.stats span{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu)}
.mos{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mos a{display:block;aspect-ratio:1/1;overflow:hidden;border-radius:4px;background:var(--soft);opacity:0;animation:rise .7s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:calc(var(--i)*110ms + 150ms)}
.mos a:nth-child(2){margin-top:28px}.mos a:nth-child(3){margin-top:-28px}
.mos img,.ph img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.mos a:hover img{transform:scale(1.06)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.tools{display:flex;gap:14px;flex-wrap:wrap;align-items:center;justify-content:space-between;padding:20px 0 12px;border-top:1px solid var(--ln2)}
.seg{display:flex;border:1px solid var(--ln2);border-radius:4px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:none;color:var(--mu);padding:9px 18px;font-size:14px;font-weight:500;transition:background .2s,color .2s}
.seg button[aria-pressed=true]{background:var(--pri);color:#fff}
.srch{flex:1;min-width:200px;max-width:340px;display:flex;align-items:center;gap:8px;border:1px solid var(--ln2);border-radius:4px;padding:0 12px;background:var(--card)}
.srch svg{width:16px;height:16px;fill:none;stroke:var(--mu);stroke-width:2;flex:none}
.srch input{border:0;background:none;color:var(--tx);font:inherit;font-size:14px;padding:10px 0;width:100%;outline:none}
.srch:focus-within{border-color:var(--ring)}
.chips{display:flex;gap:8px;flex-wrap:wrap;padding:8px 0 20px}
.chip{border:1px solid var(--ln2);background:none;color:var(--mu);padding:5px 12px;border-radius:99px;font-size:13px;transition:all .2s}
.chip:hover{border-color:var(--pri);color:var(--pri)}
.chip[aria-pressed=true]{background:var(--soft);border-color:var(--pri);color:var(--pri);font-weight:600}
.cnt{font-size:13px;color:var(--mu);margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px;padding-bottom:40px}
.card{display:block;background:var(--card);border:1px solid var(--ln);border-radius:4px;overflow:hidden;transition:transform .25s cubic-bezier(.2,.7,.2,1),border-color .25s,box-shadow .25s;opacity:0;animation:rise .55s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:calc(var(--i)*40ms)}
.card:hover{transform:translateY(-4px);border-color:var(--pri);box-shadow:0 12px 26px -14px rgba(47,125,79,.45)}
.ph{aspect-ratio:16/10;overflow:hidden;background:var(--soft)}
.card:hover .ph img{transform:scale(1.07)}
.cb{display:flex;justify-content:space-between;gap:12px;padding:14px 14px 4px}
.g{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);display:block}
.cb h3{margin:4px 0 0;font-size:16px;line-height:1.3;font-weight:600;color:var(--ink)}
.stk{display:flex;flex-direction:column;width:9px;height:46px;flex:none;border:1px solid #6f8f7a;margin-top:2px}.stk i{display:block;min-height:2px}
.mt{display:flex;justify-content:space-between;padding:8px 14px 14px;font-size:13px;color:var(--mu)}
.mt b{color:var(--acc);font-weight:700}
.empty{color:var(--mu);padding:30px 0}
.note{color:var(--mu);font-size:13px;max-width:720px;margin:0 0 40px}
.det{padding:28px 0 20px}
.back{display:inline-flex;gap:6px;align-items:center;font-size:14px;font-weight:500;color:var(--mu);transition:color .2s,transform .2s}
.back:hover{color:var(--ink);transform:translateX(-3px)}
.dh{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;padding:26px 0 24px;border-bottom:1px solid var(--ln2);margin-bottom:28px}
.dh h1{font-size:clamp(30px,5vw,52px)}
.big{text-align:right}.big b{font-size:clamp(44px,8vw,84px);font-weight:700;letter-spacing:-.04em;color:var(--acc);line-height:1;font-variant-numeric:tabular-nums}
.big span{display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mu)}
.dg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);grid-template-areas:'fig sec' 'list sec';gap:0 36px;align-items:start}.dg .fig{grid-area:fig}.dg .lrs{grid-area:list}.dg .sbox{grid-area:sec;position:sticky;top:16px}
.fig{margin:0 0 24px;border-radius:4px;overflow:hidden;background:var(--soft);animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
.fig img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block;animation:zoom 1.2s cubic-bezier(.2,.7,.2,1) both}
@keyframes zoom{from{transform:scale(1.08)}to{transform:none}}
.fig figcaption{font-size:12px;color:var(--mu);padding:8px 12px;background:var(--card);border-top:1px solid var(--ln)}
.lrs{list-style:none;margin:0;padding:0;border-top:1px solid var(--ln2)}
.lr{display:grid;grid-template-columns:28px 14px 1fr auto;gap:12px;align-items:center;padding:12px 6px;border-bottom:1px solid var(--ln);transition:background .2s;opacity:0;animation:rise .45s ease forwards;animation-delay:calc(var(--i)*50ms + 250ms)}
.lr.hl{background:var(--soft)}
.lr .n{font-size:12px;font-weight:700;color:var(--acc);font-variant-numeric:tabular-nums}
.lr .sw{width:14px;height:14px;border:1px solid var(--ink)}
.lr b{display:block;font-weight:600;color:var(--ink);font-size:15px;line-height:1.3}
.lr small{display:block;color:var(--mu);font-size:12.5px}
.ed{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mu)}
.ed input,.form input,.form select{border:1px solid var(--ln2);background:var(--card);color:var(--ink);border-radius:4px;padding:6px 8px;font:inherit;font-size:14px;min-width:0}
.ed input{width:70px;text-align:right;font-variant-numeric:tabular-nums}
.ed input:focus,.form input:focus,.form select:focus{border-color:var(--ring);outline:none}
.sbox{border:1px solid var(--ln2);background:var(--card);border-radius:4px;padding:6px 14px 14px}
.sh{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);padding:10px 0;border-bottom:1px solid var(--ln);margin-bottom:8px}
#dr{overflow-x:auto}
svg.sec{display:block;width:100%;height:auto;max-width:760px;margin:0 auto}
svg.sec text{fill:var(--ink);font:500 12.5px Inter,Arial,sans-serif}
svg.sec .dm{stroke:var(--acc);stroke-width:.9;fill:none}
svg.sec text.dt{fill:var(--acc);font-weight:600}
svg.sec .p{fill:none;stroke:var(--ink);stroke-width:.7;opacity:.65}
svg.sec .f{fill:var(--ink);opacity:.65}
svg.sec .ly{transition:opacity .25s}
svg.sec.an .ly{opacity:0;animation:drop .55s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:calc(var(--i)*80ms + 150ms)}
@keyframes drop{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
svg.sec.dim .ly{opacity:.28}svg.sec.dim .ly.hl{opacity:1}
.act{display:flex;gap:10px;flex-wrap:wrap;margin:30px 0 18px}
dialog{border:1px solid var(--ln2);border-radius:6px;background:var(--card);color:var(--tx);padding:24px;width:min(720px,calc(100vw - 24px));max-height:calc(100vh - 40px);overflow:auto}
dialog::backdrop{background:rgba(31,58,43,.45)}
.form h2{margin:0 0 16px;font-size:22px;color:var(--ink);letter-spacing:-.02em}
.fg{display:grid;grid-template-columns:110px 1fr;gap:8px;align-items:center;margin-bottom:14px;font-size:14px}
.fr{display:flex;gap:6px;margin:6px 0;flex-wrap:wrap}.fr .nm{flex:1 1 150px}.fr .mm{width:76px}.fr .nt{flex:1 1 120px}
#fm{color:var(--mu);margin:10px 0;font-size:14px}
@media (max-width:900px){.hero{grid-template-columns:1fr;padding:28px 20px;margin:16px 0 24px}.mos{display:none}.dg{grid-template-columns:1fr;grid-template-areas:'fig' 'sec' 'list'}.dg .sbox{position:static;margin-bottom:24px}.big{text-align:left}.wrap{padding:0 16px}}
@media (max-width:520px){.fg{grid-template-columns:1fr}.ed input{width:62px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.card,.mos a,.lr{opacity:1!important}svg.sec.an .ly{opacity:1!important}}
@media print{.top,.tools,.chips,.act,.back,.note,.mos{display:none}body{background:#fff}.lr,.card{opacity:1!important}}
</style>
</head>

  var tl=tot(),od='<path class="dm" d="M'+oX+' '+topY+'V'+lastY+'M'+(oX-6)+' '+topY+'h12M'+(oX-6)+' '+lastY+'h12"/><text class="dt" transform="rotate(-90 '+(oX-8)+' '+((topY+lastY)/2)+')" x="'+(oX-8)+'" y="'+((topY+lastY)/2)+'" text-anchor="middle">'+tl+' mm</text>';
  var ffl='<path d="M'+(oX+14)+' '+topY+'H'+(X0+W+20)+'" stroke="var(--ink)" stroke-width=".7" stroke-dasharray="8 3 2 3" fill="none"/><text x="'+X0+'" y="'+(topY-7)+'" style="font-size:10px;letter-spacing:.06em">FFL ±0.00</text>';
  return '<svg class="sec'+(anim?' an':'')+'" viewBox="0 0 '+VW+' '+(Math.max(y,ly)+24)+'" role="img" aria-label="Section of '+cur.n+'">'+defs+ffl+od+o+'</svg>';
}
/* ---------- views ---------- */
var ICON={s:'<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>',b:'<svg viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>',c:'<svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="1"/><path d="M5 15V5h10"/></svg>',p:'<svg viewBox="0 0 24 24"><path d="M6 9V3h12v6M6 18H4v-7h16v7h-2M7 14h10v7H7z"/></svg>'};
function list(){var s=q.toLowerCase();return ALL().filter(function(d){return (cat==='all'||d.c===cat)&&(!grp||d.g===grp)&&(!s||(d.n+d.g+d.u).toLowerCase().indexOf(s)>-1)})}
function stk(d){var T=tt(d)||1;return '<span class="stk">'+d.L.filter(function(l){return l[0]!=='sub'&&!MEM(l[0])}).map(function(l){return '<i style="flex:'+Math.max(l[2],T*.07)+';background:'+F[l[0]]+(l[0]==='air'?';border-top:1px dashed var(--ink)':'')+'"></i>'}).join('')+'</span>'}
function grid(){
  var a=list();
  $('grid').innerHTML=a.map(function(d,i){return '<a class="card" href="#t-'+gid(d)+'" style="--i:'+Math.min(i,14)+'"><div class="ph"><img src="'+img(d)+'" alt="" loading="lazy" decoding="async"></div><div class="cb"><div><span class="g">'+(d.c==='h'?'Hardscape':'Softscape')+' · '+d.g+'</span><h3>'+d.n+'</h3></div>'+stk(d)+'</div><div class="mt"><span><b>'+tt(d)+'</b> mm total</span><span>'+d.L.length+' layers</span></div></a>'}).join('')||'<p class="empty">No matching floor types.</p>';
  $('cnt').textContent=a.length+(a.length===1?' floor type':' floor types');
}
function chipsRow(){
  var gs=[];ALL().forEach(function(d){if((cat==='all'||d.c===cat)&&gs.indexOf(d.g)<0)gs.push(d.g)});
  if(grp&&gs.indexOf(grp)<0)grp='';
  $('chips').innerHTML='<button class="chip" data-g="" aria-pressed="'+(!grp)+'">All groups</button>'+gs.map(function(g){return '<button class="chip" data-g="'+g+'" aria-pressed="'+(grp===g)+'">'+g+'</button>'}).join('');
}
function stats(){var a=ALL(),h=a.filter(function(d){return d.c==='h'}).length;if($('s1')){$('s1').textContent=a.length;$('s2').textContent=h;$('s3').textContent=a.length-h}}
function home(){
  cur=null;L=null;
  var want=['Interlock Paver – Pedestrian','Granite on Mortar','Natural Turf – Sod','Timber Deck – Ground Level'],mos=want.map(function(n,i){var d=BASE.filter(function(x){return x.n===n})[0];return d?'<a href="#t-'+gid(d)+'" style="--i:'+i+'" aria-label="'+d.n+'"><img src="'+img(d)+'" alt=""></a>':''}).join('');
  $('app').innerHTML='<section class="hero"><div><p class="eyebrow">Landscape floor assemblies</p><h1>Every floor,<br>layer by layer.</h1><p class="lead">Typical hardscape and softscape build-ups with sizes, layer order and thicknesses. Pick a floor type to see its section instantly.</p><div class="stats"><div><b id="s1">0</b><span>Floor types</span></div><div><b id="s2">0</b><span>Hardscape</span></div><div><b id="s3">0</b><span>Softscape</span></div></div></div><div class="mos">'+mos+'</div></section>'+
  '<section><div class="tools"><div class="seg" role="group" aria-label="Category"><button data-c="all">All</button><button data-c="h">Hardscape</button><button data-c="s">Softscape</button></div><label class="srch">'+ICON.s+'<input id="q" type="search" placeholder="Search floor types" aria-label="Search floor types" value="'+esc(q)+'"></label></div><div class="chips" id="chips"></div><p class="cnt" id="cnt"></p><div class="grid" id="grid"></div></section><p class="note">Thicknesses and sizes are typical values for guidance only. Always follow project specifications and the structural engineer’s and supplier’s requirements.</p>';
  seg();chipsRow();grid();stats();
}
function seg(){document.querySelectorAll('.seg button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.c===cat)})}
function countTo(el,to){
  if(matchMedia('(prefers-reduced-motion:reduce)').matches||!to){el.textContent=to;return}
  var t0=performance.now();(function st(t){var p=Math.min(1,(t-t0)/700),e=1-Math.pow(1-p,3);el.textContent=Math.round(to*e);if(p<1)requestAnimationFrame(st)})(t0);
}
function detail(id){
  var d=ALL().filter(function(x){return gid(x)===id})[0];
  if(!d){location.hash='';return}
  cur=d;L=d.L.map(function(l){return l.slice()});
  var rows=L.map(function(l,i){return '<li class="lr" data-i="'+i+'" style="--i:'+i+'"><span class="n">'+(i+1)+'</span><span class="sw" style="background:'+F[l[0]]+'"></span><div><b>'+l[1]+'</b><small>'+fn(l,i)+(l[3]?' · '+l[3]:'')+'</small></div>'+(MEM(l[0])||(l[0]==='sub'&&!l[2])?'<span class="ed">—</span>':'<label class="ed"><input type="number" min="0" step="5" value="'+l[2]+'" data-t="'+i+'" aria-label="Thickness of '+l[1]+' in mm">mm</label>')+'</li>'}).join('');
  $('app').innerHTML='<article class="det"><a class="back" href="#">'+ICON.b+'All floor types</a><header class="dh"><div><p class="eyebrow">'+(d.c==='h'?'Hardscape':'Softscape')+' · '+d.g+'</p><h1>'+d.n+'</h1><p class="lead">'+d.sz+(d.u?' · '+d.u:'')+'</p></div><div class="big"><b id="tt">0</b><span>mm total thickness</span></div></header>'+
  '<div class="dg"><figure class="fig"><img src="'+img(d)+'" alt="Plan view of '+d.n+'"><figcaption>Plan view · illustrative</figcaption></figure><ol class="lrs" id="lrs">'+rows+'</ol><div class="sbox"><div class="sh"><span>Section</span><span>NTS · dimensions in mm</span></div><div id="dr">'+drawing(true)+'</div></div></div>'+
  '<div class="act"><button class="btn" id="cp">'+ICON.c+'Copy as text</button><button class="btn" id="pr">'+ICON.p+'Print</button><button class="btn" id="rs">Reset values</button>'+(d.cu&&own?'<button class="btn" id="del">Delete this type</button>':'')+'</div><p class="note">Typical values for guidance only. Edit a thickness to update the section and the total. Edits are temporary and are not saved.</p></article>';
  countTo($('tt'),tot());
}
function txt(){return unesc(cur.n+' ('+cur.sz+')\n'+L.map(function(l,i){return (i+1)+'. '+l[1]+(l[2]?' – '+l[2]+' mm':'')}).join('\n')+'\nTotal: '+tot()+' mm (excluding subgrade)')}
function route(){var h=location.hash.slice(1);window.scrollTo(0,0);if(h.indexOf('t-')===0)detail(h.slice(2));else home()}
/* ---------- owner add form ---------- */
function formHtml(){
  var gl={};ALL().forEach(function(d){gl[d.g]=1});
  var mo=Object.keys(DN).map(function(k){return '<option value="'+k+'">'+DN[k]+'</option>'}).join('');
  var rows=fr.map(function(r,i){return '<div class="fr"><select data-r="'+i+'" data-k="0" aria-label="Material">'+mo.replace('value="'+r[0]+'"','value="'+r[0]+'" selected')+'</select><input class="nm" data-r="'+i+'" data-k="1" value="'+esc(r[1])+'" placeholder="'+esc(DN[r[0]])+'" aria-label="Layer name"><input class="mm" type="number" min="0" step="5" data-r="'+i+'" data-k="2" value="'+esc(r[2])+'" aria-label="Thickness mm"><input class="nt" data-r="'+i+'" data-k="3" value="'+esc(r[3])+'" placeholder="Note" aria-label="Note"><button class="btn" data-rm="'+i+'" aria-label="Remove layer">×</button></div>'}).join('');
  return '<div class="form"><h2>Add floor type</h2><div class="fg"><label>Category</label><select data-f="c"><option value="h"'+(ff.c==='h'?' selected':'')+'>Hardscape</option><option value="s"'+(ff.c==='s'?' selected':'')+'>Softscape</option></select><label>Group</label><input data-f="g" list="gl" value="'+esc(ff.g)+'" placeholder="e.g. Pavers"><datalist id="gl">'+Object.keys(gl).map(function(g){return '<option value="'+g+'">'}).join('')+'</datalist><label>Type name</label><input data-f="n" value="'+esc(ff.n)+'"><label>Unit / size</label><input data-f="sz" value="'+esc(ff.sz)+'" placeholder="600×300 mm, 30 thick"><label>Typical use</label><input data-f="u" value="'+esc(ff.u)+'"></div><b>Layers (top = exterior)</b>'+rows+'<div class="fr"><button class="btn" id="al">+ Add layer</button></div><div id="fm"></div><div class="fr"><button class="btn pri" id="sv">Save type</button><button class="btn" id="cn">Cancel</button></div></div>';
}
function openForm(){ff={c:cat==='s'?'s':'h',g:'',n:'',sz:'',u:''};fr=[['paver','',60,''],['sand','',30,''],['agg','',150,''],['sub','',0,'']];$('dlg').innerHTML=formHtml();$('dlg').showModal()}
function msg(t){var m=$('fm');if(m)m.textContent=t}
async function save(){
  var rows=fr.map(function(r){return [r[0],String(r[1]||DN[r[0]]).trim(),Math.max(0,+r[2]||0),String(r[3]||'').trim()]});
  if(!ff.n.trim()||!ff.g.trim()){msg('Enter a group and a type name.');return}
  if(!rows.length){msg('Add at least one layer.');return}
  try{var ref=await db.collection('types').add({c:ff.c,g:ff.g.trim(),n:ff.n.trim(),sz:ff.sz.trim(),u:ff.u.trim(),L:JSON.stringify(rows)});pend='c-'+String(ref.id).replace(/[^A-Za-z0-9-]/g,'');$('dlg').close()}
  catch(e){msg('Could not save: '+((e&&(e.message||e.code))||'error'))}
}
/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var t=e.target.closest('button');if(!t)return;
  if(t.id==='add'){openForm();return}
  if(t.id==='al'){fr.push(['agg','',0,'']);$('dlg').innerHTML=formHtml();return}
  if(t.dataset.rm!==undefined){fr.splice(+t.dataset.rm,1);$('dlg').innerHTML=formHtml();return}
  if(t.id==='cn'){$('dlg').close();return}
  if(t.id==='sv'){save();return}
  if(t.dataset.c!==undefined&&t.closest('.seg')){cat=t.dataset.c;grp='';seg();chipsRow();grid();return}
  if(t.classList.contains('chip')){grp=t.dataset.g;chipsRow();grid();return}
  if(!cur)return;
  if(t.id==='rs'){detail(gid(cur))}
  if(t.id==='pr')window.print();
  if(t.id==='cp'){try{navigator.clipboard.writeText(txt()).then(function(){t.lastChild.textContent='Copied'},function(){t.lastChild.textContent='Copy unavailable'})}catch(x){t.lastChild.textContent='Copy unavailable'}}
  if(t.id==='del'&&cur.cu){if(!t.dataset.sure){t.dataset.sure=1;t.textContent='Click again to delete';return}db.collection('types').doc(cur.did).delete().catch(function(){t.textContent='Delete failed'})}
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='q'){q=t.value.trim();grid();return}
  if(t.dataset.f){ff[t.dataset.f]=t.value;return}
  if(t.dataset.r!==undefined){fr[+t.dataset.r][+t.dataset.k]=t.value;return}
  if(t.dataset.t!==undefined&&cur){L[+t.dataset.t][2]=Math.max(0,+t.value||0);$('dr').innerHTML=drawing(false);$('tt').textContent=tot()}
});
function hl(i,on){var s=document.querySelector('svg.sec');if(!s)return;document.querySelectorAll('[data-i="'+i+'"]').forEach(function(el){el.classList.toggle('hl',on)});s.classList.toggle('dim',on)}
document.addEventListener('mouseover',function(e){var el=e.target.closest('.lr,.ly');if(el)hl(el.dataset.i,true)});
document.addEventListener('mouseout',function(e){var el=e.target.closest('.lr,.ly');if(el)hl(el.dataset.i,false)});
document.addEventListener('focusin',function(e){var el=e.target.closest('.lr');if(el)hl(el.dataset.i,true)});
document.addEventListener('focusout',function(e){var el=e.target.closest('.lr');if(el)hl(el.dataset.i,false)});
var rz;window.addEventListener('resize',function(){clearTimeout(rz);rz=setTimeout(function(){if(cur&&$('dr'))$('dr').innerHTML=drawing(false)},200)});
window.addEventListener('hashchange',route);
route();
(async function(){
  if(typeof claude==='undefined'||!claude.use)return;
  try{var u=await claude.use('user');own=u?await u.isOwner():false}catch(e){}
  try{db=await claude.use('db')}catch(e){}
  if(!db)return;
  $('add').hidden=!own;
  db.collection('types').onSnapshot(function(sn){
    CUS=[];
    sn.docs.forEach(function(d){
      try{var x=d.data()||{},ls=JSON.parse(x.L||'[]').filter(function(l){return F[l[0]]}).map(function(l){return [l[0],esc(l[1]),Math.max(0,+l[2]||0),esc(l[3])]});
        if(ls.length&&(x.c==='h'||x.c==='s')&&x.n)CUS.push({id:'c-'+String(d.id).replace(/[^A-Za-z0-9-]/g,''),did:d.id,c:x.c,g:esc(x.g||'Other'),n:esc(x.n),sz:esc(x.sz),u:esc(x.u),L:ls,cu:1})}catch(e){}
    });
    if(pend&&CUS.some(function(d){return d.id===pend})){var pp=pend;pend=null;location.hash='t-'+pp;return}
    if(cur&&cur.cu&&!CUS.some(function(d){return d.id===cur.id})){location.hash='';return}
    if(!cur&&$('grid')){chipsRow();grid();stats()}
    if(cur&&!cur.cu&&location.hash.indexOf('t-c-')===0)route();
  },function(){});
})();
</script>
